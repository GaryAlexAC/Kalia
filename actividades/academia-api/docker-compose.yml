# Opcional: levanta PostgreSQL sin instalarlo. Uso: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: academia123
      POSTGRES_DB: academia
    ports:
      - "5432:5432"
    volumes:
      - academia_data:/var/lib/postgresql/data
volumes:
  academia_data:
