services:
  postgres:
    image: postgres:17-alpine
    container_name: 02track-postgres
    environment:
      POSTGRES_DB: track
      POSTGRES_USER: track
      POSTGRES_PASSWORD: track_dev_password
    ports:
      - "5433:5432"
    volumes:
      - track_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track -d track"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  track_postgres_data:
    name: 02track-postgres-data-v17
